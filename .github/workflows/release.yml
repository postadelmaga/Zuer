# Release di Zuer: pacchetti macOS arm64 e Windows x64, pubblicati nella GitHub
# Release del tag. Parte da sola al push di un tag `v*`; a mano (workflow_dispatch)
# su un tag già esistente, o in prova (`dry_run`) su qualsiasi ref senza pubblicare.
#
# Riproducibilità: Zuer al commit del tag, Zicro al commit scritto in
# .github/zicro.ref (dentro il tag stesso), Zig scaricato da ziglang.org con sha256
# verificato, FFmpeg per Windows pinnato con sha256 in scripts/fetch-ffmpeg-dlls.sh,
# FFmpeg per macOS compilato dallo stesso commit (scripts/build-ffmpeg-macos.sh).
# Pacchetti NON firmati (nessun certificato Apple/Windows configurato): vedi RELEASE.md.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da costruire (es. v1.0.0). Con dry_run anche un ramo o un commit."
        required: true
        type: string
      dry_run:
        description: "Solo build e verifiche, nessuna pubblicazione"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  ZIG_VERSION: "0.17.0"

jobs:
  meta:
    name: Tag, commit e versione
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.m.outputs.tag }}
      commit: ${{ steps.m.outputs.commit }}
      version: ${{ steps.m.outputs.version }}
      zicro: ${{ steps.m.outputs.zicro }}
      prerelease: ${{ steps.m.outputs.prerelease }}
      publish: ${{ steps.m.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - id: m
        name: Verifica tag ↔ commit ↔ versione
        env:
          INPUT_TAG: ${{ inputs.tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          REF="${INPUT_TAG:-$GITHUB_REF_NAME}"
          COMMIT="$(git rev-parse HEAD)"
          VERSION="$(sed -nE 's/^[[:space:]]*\.version = "([^"]+)".*/\1/p' build.zig.zon | head -1)"
          [[ -n "$VERSION" ]] || { echo "::error::versione non trovata in build.zig.zon"; exit 1; }
          ZICRO="$(tr -d '[:space:]' < .github/zicro.ref)"
          [[ "$ZICRO" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::.github/zicro.ref non è uno SHA completo"; exit 1; }
          PUBLISH=true
          if [[ "${DRY_RUN:-false}" == true ]]; then
            PUBLISH=false
          else
            # Il tag deve esistere sul remoto, puntare a questo commit e chiamarsi v<versione>.
            TAGGED="$(git ls-remote "https://github.com/$GITHUB_REPOSITORY" "refs/tags/$REF^{}" "refs/tags/$REF" | awk '{print $1}' | head -1)"
            PEELED="$(git ls-remote "https://github.com/$GITHUB_REPOSITORY" "refs/tags/$REF^{}" | awk '{print $1}')"
            [[ -n "$PEELED" ]] && TAGGED="$PEELED"
            [[ -n "$TAGGED" ]] || { echo "::error::$REF non è un tag del repository"; exit 1; }
            [[ "$TAGGED" == "$COMMIT" ]] || { echo "::error::il tag $REF punta a $TAGGED, il checkout è $COMMIT"; exit 1; }
            [[ "$REF" == "v$VERSION" ]] || { echo "::error::tag $REF ma build.zig.zon dice $VERSION"; exit 1; }
          fi
          PRE=false; [[ "$VERSION" == *-* ]] && PRE=true
          {
            echo "tag=$REF"; echo "commit=$COMMIT"; echo "version=$VERSION"
            echo "zicro=$ZICRO"; echo "prerelease=$PRE"; echo "publish=$PUBLISH"
          } | tee -a "$GITHUB_OUTPUT"

  linux:
    name: Gate Linux (test unitari)
    needs: meta
    runs-on: ubuntu-26.04 # wayland-scanner recente: gli XML vendored usano deprecated-since
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.meta.outputs.commit }}
          path: Zuer
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: postadelmaga/zicro
          ref: ${{ needs.meta.outputs.zicro }}
          path: Zicro
          persist-credentials: false
      - name: Zig
        run: |
          set -euo pipefail
          curl -fsSL -o zig.tar.xz "https://ziglang.org/download/$ZIG_VERSION/zig-x86_64-linux-$ZIG_VERSION.tar.xz"
          echo "1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026  zig.tar.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/zig" && tar -xJf zig.tar.xz -C "$RUNNER_TEMP/zig" --strip-components=1
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"
      - name: Dipendenze
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends glslc pkg-config \
            libwayland-dev libxkbcommon-dev libpipewire-0.3-dev libasound2-dev \
            libharfbuzz-dev libfreetype-dev libvulkan-dev libegl-dev libgl-dev libgbm-dev \
            libsystemd-dev wayland-protocols
      - name: Test Zicro
        working-directory: Zicro
        run: zig build test --summary all
      - name: Test Zuer
        working-directory: Zuer
        run: zig build test --summary all

  macos:
    name: macOS arm64
    needs: meta
    runs-on: macos-15 # Apple Silicon (arm64)
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.meta.outputs.commit }}
          path: Zuer
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: postadelmaga/zicro
          ref: ${{ needs.meta.outputs.zicro }}
          path: Zicro
          persist-credentials: false
      - name: Runner arm64
        run: |
          uname -m; sw_vers
          [[ "$(uname -m)" == arm64 ]] || { echo "::error::runner non arm64"; exit 1; }
          system_profiler SPDisplaysDataType | grep -E 'Chipset|Metal|Type' || true
      - name: Zig e strumenti
        run: |
          set -euo pipefail
          curl -fsSL -o zig.tar.xz "https://ziglang.org/download/$ZIG_VERSION/zig-aarch64-macos-$ZIG_VERSION.tar.xz"
          echo "b607e9b9234790a008116ae5bdb71c6243b84b9fb42a53a9e70fde41c06c536a  zig.tar.xz" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/zig" && tar -xJf zig.tar.xz -C "$RUNNER_TEMP/zig" --strip-components=1
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"
          # shaderc: SPIR-V a build time; molten-vk: Vulkan su Metal, va NEL bundle;
          # ffmpeg (CLI): solo per generare la clip di prova, non entra nel pacchetto.
          brew install --quiet shaderc imagemagick molten-vk ffmpeg
          brew info --json=v2 molten-vk | python3 -c 'import json,sys; f=json.load(sys.stdin)["formulae"][0]; print("molten-vk", f["installed"][0]["version"], f["license"])'
      # FFmpeg LGPL per il bundle: ~5 min di compilazione, in cache per commit+flag.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ffmpeg
          key: ffmpeg-macos-arm64-${{ hashFiles('Zuer/scripts/build-ffmpeg-macos.sh') }}
      - name: FFmpeg per il bundle (scripts/build-ffmpeg-macos.sh)
        working-directory: Zuer
        run: |
          set -euo pipefail
          ZUER_FFMPEG_WORK="$RUNNER_TEMP/ffmpeg-build" scripts/build-ffmpeg-macos.sh "$RUNNER_TEMP/ffmpeg"
          cat "$RUNNER_TEMP/ffmpeg/share/zuer/FFmpeg-SOURCE.txt"
      - name: Build e bundle (scripts/build-macos-bundle.sh)
        working-directory: Zuer
        run: |
          set -euo pipefail
          zig version
          MVK="$(brew --prefix molten-vk)"
          export ZUER_FFMPEG_DIR="$RUNNER_TEMP/ffmpeg"
          export ZUER_MOLTENVK="$MVK/lib/libMoltenVK.dylib"
          export ZUER_MOLTENVK_LICENSE="$(find "$MVK/" -maxdepth 1 -iname 'LICENSE*' | head -1)"
          [[ -n "$ZUER_MOLTENVK_LICENSE" ]] || { echo "::error::licenza MoltenVK non trovata in $MVK"; ls "$MVK"; exit 1; }
          ZUER_ICON_FONT="/System/Library/Fonts/Supplemental/Arial Bold.ttf" \
            scripts/build-macos-bundle.sh --arch arm64 --build --require-full --out "$RUNNER_TEMP/macos"
          mkdir -p "$RUNNER_TEMP/dist"
          mv "$RUNNER_TEMP/macos/Zuer-macos-arm64.tar.gz" "$RUNNER_TEMP/dist/zuer-$VERSION-macos-arm64.tar.gz"
          # Strumento di prova headless (NON nel pacchetto): stessi plugin e librerie dell'app.
          zig build feature-probe -Doptimize=ReleaseFast
      - name: Verifica del pacchetto (copia pulita)
        run: |
          set -euo pipefail
          C="$RUNNER_TEMP/clean"; rm -rf "$C"; mkdir -p "$C"
          tar -xzf "$RUNNER_TEMP/dist/zuer-$VERSION-macos-arm64.tar.gz" -C "$C"
          APP="$C/Zuer.app"; EXE="$APP/Contents/MacOS/zuer-gui"; FW="$APP/Contents/Frameworks"
          find "$APP" -type f | sed "s|$C/||" | sort
          du -sh "$APP"; du -sh "$FW"
          # Niente file di sviluppo nel pacchetto.
          if find "$APP" -type f \( -name '*.patch' -o -name '*.log' -o -name '*.pdb' -o -name '*.dSYM' -o -name '*.o' -o -name '*.a' -o -name '*.h' -o -name '*.pc' \) | grep -q .; then
            echo "::error::file di sviluppo nel bundle"; exit 1; fi
          for f in LICENSE FFmpeg-LICENSE.txt FFmpeg-SOURCE.txt MoltenVK-LICENSE.txt; do
            [[ -f "$APP/Contents/Resources/$f" ]] || { echo "::error::$f assente"; exit 1; }; done
          grep -q 'GNU LESSER GENERAL PUBLIC LICENSE' "$APP/Contents/Resources/FFmpeg-LICENSE.txt"
          grep -q 'Apache License' "$APP/Contents/Resources/MoltenVK-LICENSE.txt"
          ls "$APP/Contents/MacOS/decoders/"libdecoder_*.dylib
          for d in pdf office media; do [[ -f "$APP/Contents/MacOS/decoders/libdecoder_$d.dylib" ]] || { echo "::error::plugin $d assente"; exit 1; }; done
          for n in avutil.61 swresample.7 swscale.10 avcodec.63 avformat.63 MoltenVK; do
            [[ -f "$FW/lib$n.dylib" ]] || { echo "::error::Frameworks/lib$n.dylib assente"; exit 1; }; done
          BINS=("$EXE" "$APP"/Contents/MacOS/decoders/*.dylib "$FW"/*.dylib)
          # Architettura: solo arm64, ovunque.
          for f in "${BINS[@]}"; do
            a="$(lipo -archs "$f")"; echo "$(basename "$f"): $a"
            [[ "$a" == arm64 ]] || { echo "::error::$f non è solo arm64 ($a)"; exit 1; }
          done
          # Dipendenze dinamiche: sistema, oppure @rpath verso una dylib presente in
          # Frameworks. Nessun percorso di build, Homebrew o /usr/local.
          for f in "${BINS[@]}"; do
            ID="$(otool -D "$f" | tail -n +2)" # nome proprio di una dylib (non è una dipendenza)
            otool -L "$f" | tail -n +2 | awk '{print $1}' | while read -r d; do
              [[ -n "$ID" && "$d" == "$ID" ]] && continue
              case "$d" in
                /usr/lib/*|/System/Library/*) ;;
                @rpath/*) [[ -f "$FW/${d#@rpath/}" ]] || { echo "::error::$(basename "$f") dipende da $d, assente in Frameworks"; exit 1; } ;;
                *) echo "::error::$(basename "$f") dipende da $d (non di sistema né nel bundle)"; exit 1 ;;
              esac
            done
            if otool -l "$f" | grep -A2 LC_RPATH | grep -E 'path (/opt/homebrew|/usr/local|/Users|'"$GITHUB_WORKSPACE"'|'"$RUNNER_TEMP"')'; then
              echo "::error::$(basename "$f"): rpath verso la macchina di build"; exit 1; fi
          done
          otool -L "$EXE" "$FW/libavcodec.63.dylib" "$FW/libMoltenVK.dylib"
          # Nessuna dipendenza statica da Vulkan o libav nell'eseguibile: si aprono a runtime.
          if otool -L "$EXE" | grep -qiE 'vulkan|moltenvk|libav|libsw'; then echo "::error::zuer-gui linka Vulkan/libav"; exit 1; fi
          # Metadati.
          plutil -lint "$APP/Contents/Info.plist"
          for k in CFBundleIdentifier CFBundleShortVersionString CFBundleExecutable CFBundleIconFile LSMinimumSystemVersion; do
            echo "$k = $(/usr/libexec/PlistBuddy -c "Print :$k" "$APP/Contents/Info.plist" 2>/dev/null || echo '(assente)')"
          done
          for e in pdf docx xlsx pptx mp4 obj; do
            grep -q "<string>$e</string>" "$APP/Contents/Info.plist" || { echo "::error::estensione $e non dichiarata"; exit 1; }; done
          # Firma: solo ad-hoc (nessun certificato). Su arm64 macOS esige almeno questa.
          codesign -dv "$APP" 2>&1 | grep -E 'Signature|Identifier|flags|Sealed' || true
          codesign --verify --strict --deep --verbose=2 "$APP"
          [[ -f "$APP/Contents/Resources/zuer.icns" ]] || { echo "::error::icona assente"; exit 1; }
      - name: Prove delle funzionalità (feature-probe dentro una copia del bundle)
        run: |
          set -euo pipefail
          T="$RUNNER_TEMP/probe"; rm -rf "$T"; mkdir -p "$T"
          cp -R "$RUNNER_TEMP/clean/Zuer.app" "$T/"
          cp "$GITHUB_WORKSPACE/Zuer/zig-out/bin/feature-probe" "$T/Zuer.app/Contents/MacOS/"
          P="$T/Zuer.app/Contents/MacOS/feature-probe"
          D="$T/docs"; python3 "$GITHUB_WORKSPACE/Zuer/scripts/make-test-docs.py" "$D"
          # Clip con traccia audio MUTA (anullsrc): nessuna prova è mai udibile.
          ffmpeg -loglevel error -f lavfi -i testsrc2=size=1280x720:rate=30 -f lavfi -i anullsrc=r=48000:cl=stereo \
            -t 8 -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest "$D/clip.mp4"
          ffmpeg -loglevel error -f lavfi -i testsrc2=size=1280x720:rate=30 -t 4 -c:v hevc_videotoolbox -tag:v hvc1 "$D/clip-hevc.mp4" || true
          cd "$T"
          # feature-probe scrive su stderr: ogni `| tee` va con 2>&1.
          "$P" doc "$D"/prova.pdf "$D"/prova.docx "$D"/prova.xlsx "$D"/prova.pptx "$D"/prova.odt "$D"/prova.ods "$D"/cubo.obj "$D"/prova.txt "$D"/clip.mp4
          "$P" page "$D/prova.pdf" 2 2>&1 | tee page2.log
          grep -q 'immagine 1650x1275' page2.log || { echo "::error::pagina ruotata di 90° non resa in orizzontale"; exit 1; }
          "$P" page "$D/prova.pdf" 3
          "$P" video "$D/clip.mp4" 2>&1 | tee video.log
          grep -q 'decodifica hardware: sì' video.log && echo "VideoToolbox: attivo" || echo "::warning::decodifica hardware non attiva sul runner (software)"
          [[ -f "$D/clip-hevc.mp4" ]] && "$P" video "$D/clip-hevc.mp4"
          if ! "$P" audio "$D/clip.mp4"; then echo "::warning::audio: nessun dispositivo di uscita utilizzabile sul runner"; fi
          # 3D: MoltenVK del bundle su Metal. Se il runner non espone Metal è un limite
          # dell'hardware virtuale (dichiarato), non un esito positivo.
          if "$P" gpu 2>&1 | tee gpu.log; then echo "3D: OK"
          elif system_profiler SPDisplaysDataType | grep -q 'Metal'; then echo "::error::3D fallito con Metal disponibile"; exit 1
          else echo "::warning::runner senza Metal: 3D non verificabile qui"; fi
          # Ripiego: senza Vulkan il renderer si spegne con l'errore giusto, l'app no.
          ZUER_VULKAN_LOADER=none "$P" gpu 2>&1 | tee nogpu.log || true
          grep -q 'VulkanLoaderMissing' nogpu.log || { echo "::error::ripiego senza Vulkan non segnalato"; exit 1; }
      - name: Smoke test della GUI
        run: |
          set -euo pipefail
          EXE="$RUNNER_TEMP/clean/Zuer.app/Contents/MacOS/zuer-gui"; D="$RUNNER_TEMP/probe/docs"
          OUT="$("$EXE" --version 2>&1)"; echo "$OUT"
          [[ "$OUT" == "zuer-gui $VERSION" ]] || { echo "::error::--version: '$OUT'"; exit 1; }
          cd "$RUNNER_TEMP"
          FAIL=0
          run() { # $1 file, $2.. ambiente: la finestra deve restare aperta 6 s
            local f=$1; shift
            env ZUER_NO_CRASH_REPORT=1 ZUER_TRACE=1 "$@" "$EXE" "$f" > gui.log 2>&1 & local P=$!
            sleep 6
            if kill -0 $P 2>/dev/null; then echo "ok: $(basename "$f") $* — viva dopo 6 s"; kill $P; wait $P 2>/dev/null || true
              grep -E 'zuer gpu: using|init renderer Vulkan fallita|libav non disponibile|zuer video' gui.log || true
            else
              local RC=0; wait $P || RC=$?
              echo "::error::zuer-gui uscito (rc=$RC) con $(basename "$f") $*"; FAIL=1
              echo "--- gui.log"; cat gui.log
              # Stesso avvio sotto lldb: stack di tutti i thread al crash.
              echo "--- lldb"
              env ZUER_NO_CRASH_REPORT=1 "$@" perl -e 'alarm 90; exec @ARGV' lldb --batch -o "process launch -- '$f'" -k "thread backtrace all" -k "quit 1" "$EXE" 2>&1 | tail -150 || true
            fi
          }
          run "$D/prova.txt"
          run "$D/prova.pdf"
          run "$D/prova.docx"
          run "$D/prova.xlsx"
          run "$D/clip.mp4"
          run "$D/cubo.obj"
          run "$D/cubo.obj" ZUER_VULKAN_LOADER=none
          [[ $FAIL == 0 ]] || exit 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-arm64
          path: ${{ runner.temp }}/dist/zuer-${{ needs.meta.outputs.version }}-macos-arm64.tar.gz
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows x64
    needs: meta
    runs-on: windows-2022 # NSIS e MSYS2 preinstallati
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.meta.outputs.commit }}
          path: Zuer
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: postadelmaga/zicro
          ref: ${{ needs.meta.outputs.zicro }}
          path: Zicro
          persist-credentials: false
      - name: Zig e strumenti
        run: |
          set -euo pipefail
          curl -fsSL -o zig.zip "https://ziglang.org/download/$ZIG_VERSION/zig-x86_64-windows-$ZIG_VERSION.zip"
          echo "b5663f69581dcf391293fbf16c06cb80d81d806545ce618b4d0bab7f0eb8c428  zig.zip" | sha256sum -c -
          unzip -q zig.zip -d "$RUNNER_TEMP"
          echo "$(cygpath -w "$RUNNER_TEMP/zig-x86_64-windows-$ZIG_VERSION")" >> "$GITHUB_PATH"
          # glslc (shader), objdump (verifica import), ImageMagick (icona) da MSYS2; il
          # loader Vulkan di MSYS2 serve SOLO alla prova "loader senza driver".
          /c/msys64/usr/bin/pacman.exe -S --noconfirm --needed --noprogressbar \
            mingw-w64-ucrt-x86_64-shaderc mingw-w64-ucrt-x86_64-binutils mingw-w64-ucrt-x86_64-imagemagick \
            mingw-w64-ucrt-x86_64-pkgconf mingw-w64-ucrt-x86_64-vulkan-loader mingw-w64-ucrt-x86_64-ffmpeg \
            mingw-w64-ucrt-x86_64-mesa
      - name: Build e installer (scripts/build-windows-installer.sh)
        working-directory: Zuer
        run: |
          set -euo pipefail
          # MSYS2 e NSIS in coda al PATH: non devono coprire gli strumenti di Git Bash.
          export PATH="$PATH:/c/msys64/ucrt64/bin:/c/Program Files (x86)/NSIS"
          # zig interroga pkg-config per le librerie di sistema; sul runner il primo nel
          # PATH è un .BAT rotto di Strawberry Perl. Uno funzionante e SENZA pacchetti:
          # FFmpeg viene dalle import-lib vendored, come nel cross-build da Linux.
          mkdir -p "$RUNNER_TEMP/no-pc"
          export PKG_CONFIG="$(cygpath -w /c/msys64/ucrt64/bin/pkg-config.exe)"
          export PKG_CONFIG_LIBDIR="$(cygpath -w "$RUNNER_TEMP/no-pc")" PKG_CONFIG_PATH=
          export ZUER_ICON_FONT='C:\Windows\Fonts\arialbd.ttf' 
          zig version; glslc --version | head -1; makensis -VERSION
          mkdir -p "$RUNNER_TEMP/dist"
          scripts/build-windows-installer.sh --out "$(cygpath -w "$RUNNER_TEMP/dist/zuer-$VERSION-windows-x64-setup.exe")"
          # Strumento di prova headless (NON nel pacchetto).
          zig build feature-probe -Doptimize=ReleaseFast --prefix "$(cygpath -w "$RUNNER_TEMP/probe")"
      - name: Verifica binari e dipendenze
        working-directory: Zuer
        run: |
          set -euo pipefail
          export PATH="$PATH:/c/msys64/ucrt64/bin"
          B=zig-out/win-installer/bin
          ls -la "$B"
          if find "$B" -type f \( -name '*.patch' -o -name '*.log' -o -name '*.pdb' -o -name '*.lib' \) | grep -q .; then
            echo "::error::file di sviluppo nella staging"; exit 1; fi
          for f in LICENSE.txt FFmpeg-LICENSE.txt FFmpeg-SOURCE.txt decoder_office.dll decoder_media.dll; do [[ -f "$B/$f" ]] || { echo "::error::$f assente"; exit 1; }; done
          objdump -f "$B/zuer-gui.exe" | grep -q 'file format pei-x86-64' || { echo "::error::zuer-gui.exe non è PE x86-64"; exit 1; }
          # Ogni DLL importata: o è nel pacchetto, o è di sistema (System32). Vulkan
          # non è MAI importato: il loader si apre a runtime (src/renderer/vk_loader.zig).
          MISSING=0
          for f in "$B"/*.exe "$B"/*.dll; do
            echo "$(basename "$f"): $(objdump -p "$f" | awk '/DLL Name/{printf "%s ", $3}')"
            for d in $(objdump -p "$f" | awk '/DLL Name/{print $3}'); do
              if [[ "${d,,}" == vulkan-1.dll ]]; then echo "::error::$(basename "$f") importa vulkan-1.dll"; MISSING=1; continue; fi
              if [[ -f "$B/$d" ]]; then continue; fi
              if [[ -f "/c/Windows/System32/$d" || -f "/c/Windows/System32/downlevel/$d" || "$d" == api-ms-win-* ]]; then continue; fi
              echo "::warning::$(basename "$f") importa $d, né nel pacchetto né in System32"; MISSING=1
            done
          done
          [[ $MISSING == 0 ]] || { echo "::error::dipendenze non risolte o Vulkan importato (sopra)"; exit 1; }
      - name: Installazione, prove, disinstallazione (cartella pulita)
        env:
          MSYS_NO_PATHCONV: "1" # /S, /D=, _?= vanno all'installer così come sono
        run: |
          set -euo pipefail
          SETUP="$RUNNER_TEMP/dist/zuer-$VERSION-windows-x64-setup.exe"
          DIR='C:\zuer-ci'; UDIR=/c/zuer-ci
          rm -rf "$UDIR"
          "$SETUP" /S "/D=$DIR"
          ls -la "$UDIR"
          for f in zuer-gui.exe uninstall.exe LICENSE.txt avformat-63.dll decoder_text.dll decoder_office.dll; do
            [[ -f "$UDIR/$f" ]] || { echo "::error::$f non installato"; exit 1; }; done
          reg query 'HKCU\Software\Microsoft\Windows\CurrentVersion\Uninstall\Zuer' | tee reg.txt
          grep -q "DisplayVersion.*$VERSION" reg.txt || { echo "::error::DisplayVersion errata"; exit 1; }
          reg query 'HKCU\Software\Classes\.docx\OpenWithProgids' | grep -q Zuer.Viewer || { echo "::error::.docx non associato"; exit 1; }
          # Il runner NON ha alcun loader Vulkan: è esattamente il caso "Windows senza
          # Vulkan" che deve funzionare. Nulla viene aggiunto al PATH.
          [[ ! -f /c/Windows/System32/vulkan-1.dll ]] || { echo "::error::il runner ha vulkan-1.dll: la prova senza loader non è valida"; exit 1; }
          OUT="$("$UDIR/zuer-gui.exe" --version 2>&1 | tr -d '\r')"; echo "$OUT"
          [[ "$OUT" == "zuer-gui $VERSION" ]] || { echo "::error::--version: '$OUT'"; exit 1; }
          D="$RUNNER_TEMP/docs"; python "$(cygpath -w "$GITHUB_WORKSPACE/Zuer/scripts/make-test-docs.py")" "$(cygpath -w "$D")"
          /c/msys64/ucrt64/bin/ffmpeg.exe -loglevel error -f lavfi -i testsrc2=size=640x360:rate=30 -f lavfi -i anullsrc=r=48000:cl=stereo \
            -t 6 -c:v mpeg4 -c:a aac -shortest "$(cygpath -w "$D/clip.mp4")"
          # Prove headless dalla cartella installata (plugin e DLL FFmpeg del pacchetto).
          cp "$RUNNER_TEMP/probe/bin/feature-probe.exe" "$UDIR/"
          W() { cygpath -w "$1"; }
          "$UDIR/feature-probe.exe" doc "$(W "$D/prova.docx")" "$(W "$D/prova.xlsx")" "$(W "$D/prova.pptx")" "$(W "$D/prova.odt")" "$(W "$D/prova.ods")" "$(W "$D/cubo.obj")" "$(W "$D/prova.txt")" "$(W "$D/clip.mp4")"
          "$UDIR/feature-probe.exe" video "$(W "$D/clip.mp4")"
          if ! "$UDIR/feature-probe.exe" audio "$(W "$D/clip.mp4")"; then echo "::warning::audio: nessun dispositivo di uscita utilizzabile sul runner"; fi
          "$UDIR/feature-probe.exe" gpu > gpu-noloader.log 2>&1 || true; cat gpu-noloader.log
          grep -q 'VulkanLoaderMissing' gpu-noloader.log || { echo "::error::senza loader: atteso VulkanLoaderMissing"; exit 1; }
          rm -f "$UDIR/feature-probe.exe"
          gui() { # $1 etichetta, $2 file: finestra aperta per 6 s
            "$UDIR/zuer-gui.exe" "$(cygpath -w "$2")" > gui.log 2>&1 & local P=$!
            sleep 6
            if kill -0 $P 2>/dev/null; then echo "ok: $1 — viva dopo 6 s"; taskkill /F /IM zuer-gui.exe > /dev/null || true; sleep 1
            else RC=0; wait $P || RC=$?; cat gui.log; echo "::error::zuer-gui uscito (rc=$RC): $1"; exit 1; fi
          }
          gui "senza loader Vulkan, testo" "$D/prova.txt"
          gui "senza loader Vulkan, modello 3D" "$D/cubo.obj"
          gui "senza loader Vulkan, docx" "$D/prova.docx"
          gui "senza loader Vulkan, video (audio muto)" "$D/clip.mp4"
          # Il loader di MSYS2 (FUORI dal pacchetto) indicato esplicitamente: Zuer non
          # cerca vulkan-1.dll nel PATH (solo cartella dell'app e System32), e il runner
          # non ha GPU. Le DLL da cui dipende stanno in ucrt64/bin, aggiunta al PATH
          # solo per queste prove.
          VKL='C:\msys64\ucrt64\bin\vulkan-1.dll'; [[ -f /c/msys64/ucrt64/bin/vulkan-1.dll ]] || { echo "::error::loader MSYS2 assente"; exit 1; }
          LVP='C:\msys64\ucrt64\share\vulkan\icd.d\lvp_icd.x86_64.json'
          VKPATH="/c/msys64/ucrt64/bin:$PATH"
          cp "$RUNNER_TEMP/probe/bin/feature-probe.exe" "$UDIR/"
          # 1. Loader presente, nessun driver.
          PATH="$VKPATH" ZUER_VULKAN_LOADER="$VKL" VK_DRIVER_FILES='C:\nessun-driver.json' \
            "$UDIR/feature-probe.exe" gpu > gpu-nodriver.log 2>&1 || true; cat gpu-nodriver.log
          grep -qE 'VulkanNoDriver|NoGpu' gpu-nodriver.log || { echo "::error::loader senza driver: atteso VulkanNoDriver/NoGpu"; exit 1; }
          PATH="$VKPATH" ZUER_VULKAN_LOADER="$VKL" VK_DRIVER_FILES='C:\nessun-driver.json' gui "loader senza driver, modello 3D" "$D/cubo.obj"
          # 2. Vulkan funzionante: lavapipe (Mesa, rasterizzatore SOFTWARE). Prova il
          # percorso Vulkan completo su Windows vero, non una GPU fisica. Registrato come
          # un driver vero (HKLM): il runner gira elevato e il loader lì ignora
          # VK_DRIVER_FILES. Tolto subito dopo le prove.
          reg add 'HKLM\SOFTWARE\Khronos\Vulkan\Drivers' /v "$LVP" /t REG_DWORD /d 0 /f
          ls -la /c/msys64/ucrt64/share/vulkan/icd.d/ || true; cat /c/msys64/ucrt64/share/vulkan/icd.d/lvp_icd.x86_64.json || true
          ls -la /c/msys64/ucrt64/bin/vulkan_lvp.dll || true
          PATH="$VKPATH" ZUER_VULKAN_LOADER="$VKL" VK_DRIVER_FILES="$LVP" "$UDIR/feature-probe.exe" gpu > gpu-lvp.log 2>&1 || true; cat gpu-lvp.log
          if ! grep -q 'ok: gpu: cubo renderizzato' gpu-lvp.log; then
            PATH="$VKPATH" ZUER_VULKAN_LOADER="$VKL" VK_DRIVER_FILES="$LVP" VK_LOADER_DEBUG=error,warn,driver "$UDIR/feature-probe.exe" gpu 2>&1 | head -80 || true
            echo "::error::render Vulkan (lavapipe) fallito"; exit 1
          fi
          rm -f "$UDIR/feature-probe.exe"
          gvk() { # $1 etichetta, $2 secondi, $3.. ambiente in più: GUI con il cubo e lavapipe
            local label=$1 secs=$2; shift 2
            env PATH="$VKPATH" ZUER_VULKAN_LOADER="$VKL" VK_DRIVER_FILES="$LVP" "$@" "$UDIR/zuer-gui.exe" "$(cygpath -w "$D/cubo.obj")" > gui.log 2>&1 & local P=$!
            sleep "$secs"
            if kill -0 $P 2>/dev/null; then echo "ok: $label — viva dopo $secs s"; taskkill /F /IM zuer-gui.exe > /dev/null || true; sleep 1
            else RC=0; wait $P || RC=$?; cat gui.log; echo "::error::zuer-gui uscito (rc=$RC): $label"; exit 1; fi
            grep -E 'zuer gpu|Vulkan|renderer' gui.log || true
          }
          gvk "Vulkan lavapipe, cubo" 8
          grep -q 'zuer gpu: using' gui.log || { echo "::error::GUI: renderer Vulkan non acceso con lavapipe"; exit 1; }
          # 3. Device perso (iniettato): una volta → ricostruito; sempre → ripiego.
          gvk "device perso una volta" 12 ZUER_TEST_VK_LOST_AFTER=3
          grep -q 'device Vulkan perso, ricostruisco' gui.log && [[ $(grep -c 'zuer gpu: using' gui.log) -ge 2 ]] || { echo "::error::perdita del device non recuperata"; exit 1; }
          gvk "device perso sempre" 15 ZUER_TEST_VK_LOST_AFTER=3 ZUER_TEST_VK_LOST_REPEAT=1
          grep -q 'renderer GPU spento' gui.log || { echo "::error::nessun ripiego dopo perdite ripetute"; exit 1; }
          reg delete 'HKLM\SOFTWARE\Khronos\Vulkan\Drivers' /v "$LVP" /f
          # Disinstallazione silenziosa (_?= la fa aspettare; lascia solo uninstall.exe).
          "$UDIR/uninstall.exe" /S "_?=$DIR"
          if reg query 'HKCU\Software\Microsoft\Windows\CurrentVersion\Uninstall\Zuer' >/dev/null 2>&1; then
            echo "::error::voce di disinstallazione rimasta"; exit 1; fi
          if reg query 'HKCU\Software\Classes\Zuer.Viewer' >/dev/null 2>&1; then
            echo "::error::ProgID rimasto"; exit 1; fi
          LEFT="$(ls "$UDIR" | grep -v '^uninstall.exe$' || true)"
          [[ -z "$LEFT" ]] || { echo "::error::file rimasti: $LEFT"; exit 1; }
          echo "disinstallazione pulita"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64
          path: ${{ runner.temp }}/dist/zuer-${{ needs.meta.outputs.version }}-windows-x64-setup.exe
          if-no-files-found: error
          retention-days: 14

  publish:
    name: GitHub Release
    needs: [meta, linux, macos, windows]
    if: needs.meta.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.meta.outputs.tag }}
      COMMIT: ${{ needs.meta.outputs.commit }}
      VERSION: ${{ needs.meta.outputs.version }}
      ZICRO: ${{ needs.meta.outputs.zicro }}
      PRERELEASE: ${{ needs.meta.outputs.prerelease }}
    steps:
      # Solo le note: nessun codice del repository gira con il permesso di scrittura.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.meta.outputs.commit }}
          sparse-checkout: RELEASE.md
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Artefatti, checksum e manifest
        run: |
          set -euo pipefail
          cd dist
          MAC="zuer-$VERSION-macos-arm64.tar.gz"; WIN="zuer-$VERSION-windows-x64-setup.exe"
          for f in "$MAC" "$WIN"; do [[ -s "$f" ]] || { echo "::error::$f mancante"; exit 1; }; done
          [[ "$(ls | wc -l)" == 2 ]] || { echo "::error::artefatti inattesi: $(ls)"; exit 1; }
          sha256sum "$MAC" "$WIN" > SHA256SUMS
          cat > manifest.json <<JSON
          {
            "name": "zuer",
            "version": "$VERSION",
            "tag": "$TAG",
            "commit": "$COMMIT",
            "zicro_commit": "$ZICRO",
            "zig": "$ZIG_VERSION",
            "workflow_run": "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID",
            "artifacts": [
              {"file": "$MAC", "os": "macos", "arch": "arm64", "sha256": "$(sha256sum "$MAC" | cut -d' ' -f1)", "signed": false},
              {"file": "$WIN", "os": "windows", "arch": "x86_64", "sha256": "$(sha256sum "$WIN" | cut -d' ' -f1)", "signed": false}
            ]
          }
          JSON
          python3 -m json.tool manifest.json > /dev/null
          sha256sum -c SHA256SUMS
          cat SHA256SUMS manifest.json
      - name: Note di rilascio
        run: |
          set -euo pipefail
          {
            echo "Commit \`$COMMIT\` (Zicro \`$ZICRO\`). Pacchetti **non firmati**: vedi la sezione Distribuzione."
            echo
            echo '```'; cat dist/SHA256SUMS; echo '```'
            echo
            sed '1{/^# /d}' RELEASE.md
          } > notes.md
      - name: Crea o aggiorna la release (solo se dello stesso commit)
        run: |
          set -euo pipefail
          # Stabile: marcata come tale anche se la release esisteva come prerelease.
          if [[ "$PRERELEASE" == true ]]; then FLAGS=(--prerelease --latest=false); else FLAGS=(--prerelease=false --latest); fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            ASSETS="$(gh release view "$TAG" --json assets -q '.assets[].name')"
            if gh release download "$TAG" -p manifest.json -O old-manifest.json 2>/dev/null; then
              OLD="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["commit"])' old-manifest.json)"
              [[ "$OLD" == "$COMMIT" ]] || { echo "::error::la release $TAG ha artefatti del commit $OLD, non $COMMIT: non li sovrascrivo"; exit 1; }
            elif [[ -n "$ASSETS" ]]; then
              echo "::error::la release $TAG ha già artefatti senza manifest: non li sovrascrivo"; exit 1
            fi
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --title "Zuer $VERSION" --notes-file notes.md "${FLAGS[@]}"
          else
            gh release create "$TAG" dist/* --verify-tag --title "Zuer $VERSION" --notes-file notes.md "${FLAGS[@]}"
          fi
          gh release view "$TAG" --json url,isPrerelease,assets -q '{url, isPrerelease, assets: [.assets[].name]}'
